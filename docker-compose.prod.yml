version: '3.5'

services:

  app:
    image: likesistemas/php:${VERSAO:-latest}-prod
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
      - VERSAO=${VERSAO:-latest}
    volumes:
    - src:/var/www/
    environment:
    - INSTALL_COMPOSER=false
    - COMPOSER_INSTALL=false
    - PHINX_DBADAPTER=mysql
    - PHINX_DBHOST=mysql
    - PHINX_DBNAME=php
    - PHINX_DBUSER=root
    - PHINX_DBPASS=${DB_PASS:-123456}
    - PHINX_DBPORT=3306
    - DB_NAME=php
    - DB_USER=root
    - DB_PASS=${DB_PASS:-123456}
    command:
    - php -v

  nginx:
    volumes:
    - src:/var/www/

volumes:
  src:
